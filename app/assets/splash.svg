<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <!-- Full background -->
  <rect width="2732" height="2732" fill="url(#bg)"/>

  <!-- Centered microphone icon (scaled from icon.svg) -->
  <g transform="translate(1366, 1166) scale(3.2)">
    <!-- Microphone body -->
    <path d="M512 240a96 96 0 0 0-96 96v256a96 96 0 0 0 192 0V336a96 96 0 0 0-96-96z"
          fill="#ffffff"/>

    <!-- Microphone arc -->
    <path d="M704 432v80a192 192 0 0 1-384 0v-80"
          fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="round"/>

    <!-- Microphone stand -->
    <line x1="512" y1="688" x2="512" y2="784"
          stroke="#ffffff" stroke-width="56" stroke-linecap="round"/>

    <!-- Stand base -->
    <line x1="456" y1="784" x2="568" y2="784"
          stroke="#ffffff" stroke-width="56" stroke-linecap="round"/>
  </g>

  <!-- App name below the icon -->
  <text x="1366" y="1900" text-anchor="middle"
        font-family="'DM Sans', -apple-system, system-ui, sans-serif"
        font-size="160" font-weight="700" fill="#ffffff" letter-spacing="8">
    Vibe Input
  </text>

  <!-- Tagline -->
  <text x="1366" y="2100" text-anchor="middle"
        font-family="'DM Sans', -apple-system, system-ui, sans-serif"
        font-size="72" font-weight="400" fill="rgba(255,255,255,0.7)" letter-spacing="4">
    Speak Your Ideas
  </text>
</svg>
